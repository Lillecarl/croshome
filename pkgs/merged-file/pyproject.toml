[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "merged-file"
version = "0.1.0"
description = "Deep-merge declarative settings into existing JSON, TOML and YAML config files"
requires-python = ">=3.11"
dependencies = ["pyyaml", "tomli-w"]

[project.scripts]
merged-file = "mergedfile.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.wheel]
# One package, so the wheel needs no hand-maintained file list and nothing
# lands at the top of site-packages. ./tests is not in the wheel: it is
# source, not something an activation needs at runtime.
packages = ["src/mergedfile"]
