[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "croshome-secrets"
version = "0.1.0"
description = "Front end to sops for croshome's secrets/sops"
requires-python = ">=3.12"

[project.scripts]
secrets = "croshome_secrets.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.wheel]
packages = ["src/croshome_secrets"]
