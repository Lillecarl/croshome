[project]
name = "kagi-mcp"
version = "0.0.1"
description = "Kagi MCP server"
requires-python = ">=3.11"
dependencies = [
    "playwright",
    "playwright-stealth",
    "fastmcp",
]

[project.scripts]
kagi-mcp = "kagimcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kagimcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"