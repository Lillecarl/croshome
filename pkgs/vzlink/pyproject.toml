[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vzlink"
version = "0.1.0"
description = "Host-to-guest link for the Virtualization.framework builder: proxy, supervisor, guest agent"
requires-python = ">=3.11"
dependencies = ["anyio"]

[project.scripts]
# The names the nix module execs. A module behind a name may move; the name
# may not: hosts/macbook/vz-builder/vm.nix and guest.nix call these.
vzlink-proxy = "vzlink.proxy:main"
vzlink-supervisor = "vzlink.supervisor:main"
vzlink-guest = "vzlink.guest:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.wheel]
packages = ["src/vzlink"]
