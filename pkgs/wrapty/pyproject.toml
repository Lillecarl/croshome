[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wrapty"
version = "0.1.0"
description = "Minimal PTY wrapper that forwards stdin to a wrapped process"
requires-python = ">=3.9"
dependencies = ["mcp", "json-rpc", "jinja2"]

[project.scripts]
# These command names are referenced by hand-written JSON outside this
# package -- the plugin manifest in home/claude/skills/wrapty/ and the
# statusLine key wrapty-patch-statusline merges into ~/.claude/settings.json.
# The module behind a name may move; the name may not.
wrapty = "wrapty.wrapper:main"
wrapty-mcp = "wrapty.mcp:main"
wrapty-monitor = "wrapty.monitor:main"
wrapty-statusline = "wrapty.statusline:main"
wrapty-hook-stop = "wrapty.hooks:main_stop"
wrapty-hook-posttooluse = "wrapty.hooks:main_posttooluse"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.wheel]
# One package, so the wheel needs no hand-maintained file list and nothing
# lands at the top of site-packages. The prompts ship inside it, and
# hooks.py finds them relative to its own __file__.
packages = ["src/wrapty"]
