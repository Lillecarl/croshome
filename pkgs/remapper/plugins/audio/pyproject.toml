[project]
name = "remapper-audio"
version = "0.3.0"
description = "remapper plugin: PipeWire volume and sounds"
requires-python = ">=3.13"
dependencies = ["remapper"]

[project.entry-points."remapper.plugins"]
audio = "remapper_audio:Audio"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remapper_audio"]
