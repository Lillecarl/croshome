[project]
name = "remapper-ddc"
version = "0.3.0"
description = "remapper plugin: DDC/CI monitors through ddcutil"
requires-python = ">=3.13"
dependencies = ["remapper", "anyio"]

[project.entry-points."remapper.plugins"]
ddc = "remapper_ddc:Ddc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remapper_ddc"]
