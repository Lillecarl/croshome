[project]
name = "remapper-libvirt"
version = "0.3.0"
description = "remapper plugin: a libvirt VM, its USB passthrough and its input"
requires-python = ">=3.13"
dependencies = ["remapper", "anyio", "evdev"]

[project.entry-points."remapper.plugins"]
libvirt = "remapper_libvirt:Libvirt"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remapper_libvirt"]
