[project]
name = "remapper"
version = "0.3.0"
description = "A numpad as a remote control, with the actions in plugins"
requires-python = ">=3.13"
dependencies = ["anyio", "evdev", "pydantic", "pyudev"]

[project.scripts]
remapper = "remapper.daemon:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remapper"]
