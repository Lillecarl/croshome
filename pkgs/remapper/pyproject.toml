[project]
name = "remapper"
version = "0.2.0"
description = "Numpad remote control for shitbox: VM, USB passthrough, monitors, volume"
requires-python = ">=3.13"
dependencies = ["anyio", "evdev", "pydantic", "pyudev"]

[project.scripts]
remapper = "remapper.daemon:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remapper"]
