[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ocahub"
version = "0.1.0"
description = "Cross-agent message hub for OpenCode: a ZeroMQ broker and client CLI"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["anyio>=4", "mcp>=1", "pyzmq>=25"]

[project.scripts]
ocahubd = "ocahub.daemon:main"
ocac = "ocahub.cli:main"
ocahub-mcp = "ocahub.mcp_server:main"

[tool.pytest.ini_options]
markers = [
  "tui: runs the real opencode TUI under pymux; needs the TUI check's inputs, not the ordinary check",
]
# The backstop, not the fence: the tests' own waits fail in seconds
# and say why. This catches the wedge no fence sees -- a hang in a
# native call, a loop with no await -- and it dies with a stack dump
# instead of riding the run's timeout out. The floor it must clear is
# the boot: a TUI whose plugin install walks into the sandbox's dead
# network paints its first frame around 75s.
timeout = 180

[tool.setuptools.packages.find]
where = ["src"]
include = ["ocahub*"]
