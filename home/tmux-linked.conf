#! /usr/bin/env bash
# tmux, above is fake for syntax highlighting

# # status line(s)
set-option -g status 2
# set-option -g 'status-format[0]' '#{W:#I#{window_name} }'
set-option -g 'status-format[1]' ''
# set-option -g window-status-format ""
# set-option -g window-status-current-format ""
# set-option -g window-status-separator ""
set-option -g 'status-format[1]' '#{W:#I#{window_name} }'

# pane indication
set-option -g pane-border-indicators both
set-option -g pane-border-status top
set-option -g pane-border-lines number
set-hook -g after-select-pane[13] display-panes

# session management
set -g detach-on-destroy off # switch to another session instead of detaching when closing last window
bind-key -n M-s new-session

# passthrough mode - disable all bindings to pass keys through to apps (or nested tmuxes)
bind-key -Tpassthrough M-Escape set-option -g key-table root # exit: set key table back to root
bind-key -Troot M-Escape set-option -g key-table passthrough # enter: set key table to passthrough

# scrollback
set -g history-limit 50000

## rename window (disable auto-rename, unless input is empty)
bind-key -n M-R command-prompt -p "Window name:" {
    if -F "#{==:%%,}" {
        setw automatic-rename on
    } {
        rename-window "%%"
        setw automatic-rename off
    }
}

# window management
set -g renumber-windows on # keep numbers low

## cycle panes
bind-key -n M-h select-pane -t :.-
bind-key -n M-l select-pane -t :.+

## cycle windows
bind-key -n M-j previous-window
bind-key -n M-k next-window

## swap windows
bind-key -n M-J swap-window -t -1 -d
bind-key -n M-K swap-window -t +1 -d
bind-key -n M-m choose-tree -s "move-window -t '%%'"

## interactive window search
bind-key -n M-w choose-tree -Zw

## new window
bind-key -n M-c new-window -a -c "#{pane_current_path}"
bind-key -n M-q confirm-before -p "kill-pane #P? (y/n)" kill-pane

# clipboarding
bind-key -n M-e run-shell "
tmp=$(mktemp /tmp/tmux_XXXXXX.log)
tmux capture-pane -pJS - | tac | awk 'NF{p=1} p' | tac > \$tmp
tmux display-popup -E -y 0 -x 0 -w 100% -h 100% \"$EDITOR \$tmp +999999
rm \$tmp\""


# configuration reload
bind-key -n M-r source-file ~/.config/tmux/tmux.conf
