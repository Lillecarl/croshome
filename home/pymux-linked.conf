#! /usr/bin/env bash
# pymux, above is fake for syntax highlighting
#
# ../home/pymux.nix reads this file at startup with `source-file`. It is an
# out-of-store symlink, so an edit here takes effect on the next pymux server
# without a rebuild. M-r reloads a running one.
#
# The keys are ./tmux-linked.conf's keys, so one set of fingers drives both.
# What tmux does there and pymux has no command for is listed at the bottom.

# pane movement
#
# Two ways, and they answer different questions. M-h and M-l cycle: they walk
# the panes of a window in order, which is what ./tmux-linked.conf binds and
# what the fingers already know.
bind-key -n M-h select-pane -t :.-
bind-key -n M-l select-pane -t :.+

# The prefix keys move by direction instead. In a split window, and in a strip,
# "the pane to the left" is the question a person actually has, and cycling
# answers it only by luck once there are more than two panes.
#
# Behind the prefix, not M-, because M-h and M-l are taken by the cycling
# above and both are worth keeping. h/j/k/l are the vi directions, which
# `mode-keys vi` already puts in this configuration's hands.
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# window movement
bind-key -n M-j previous-window
bind-key -n M-k next-window

# window and session management
#
# `new-window` takes no `-c "#{pane_current_path}"` here. pymux passes
# `-c` to the shell as a literal directory and expands no format in it, so
# tmux's line would ask for a directory named after the format itself.
bind-key -n M-c new-window
bind-key -n M-s new-session
bind-key -n M-q confirm-before -p "kill-pane? (y/n)" kill-pane

# splits. The double dash after "-" is what stops docopt reading it as a flag.
bind-key "|" split-window -h
bind-key "-" -- split-window -v

# configuration reload
bind-key -n M-r source-file ~/.config/pymux/pymux.conf

# Wanted here, and not yet possible:
#
# - `{` and `}` for niri's consume-or-expel: move the focused pane into the
#   column beside it, or out of a shared column into one of its own, with one
#   key doing both. pymux has `move-column -L|-R`, which moves a whole column
#   along the row, and `break-pane`, which makes a new window. Neither is that
#   move. Lillecarl/pymux#213 asks for it; bind it here once it lands.
#
#   Two questions there are open, and both change the line this file ends up
#   holding: whether it is one `consume-or-expel -L|-R` or two commands, and
#   which keys the strip's three commands take (Lillecarl/pymux#212). The key
#   on this side is settled -- `{` and `}`, as niri binds them.
#
# What ./tmux-linked.conf has and this does not, and why:
#
# - M-w and M-m need `choose-tree`, and M-e needs `run-shell`. pymux has
#   neither command.
# - M-J, M-K and M-R bind now. Uppercase Alt keys answered "Invalid key" until
#   Lillecarl/pymux#204, and any single character works since. Their commands
#   are still missing: M-J and M-K need `swap-window`, and pymux swaps panes,
#   not windows; M-R toggles `automatic-rename` through an `if -F` block, and
#   pymux has neither.
# - M-Escape switches to a passthrough key table. pymux has no key tables.
# - The status line is one line here. `status` is on or off, so tmux's second
#   row and its `status-format` entries have nowhere to go.
